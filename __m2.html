<!doctype html><html><head><meta charset="utf-8"><title>t</title><style>body{margin:0;background:#111}iframe{display:block;width:390px;height:2600px;border:0}</style></head>
<body><iframe id="f" src="/index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load', function(){
  var d=document.getElementById('f').contentDocument;
  setTimeout(function(){
    ['stPopup','stAd','cookie'].forEach(function(id){var e=d.getElementById(id); if(e) e.remove();});
    var sw=Math.max(d.documentElement.scrollWidth,d.body.scrollWidth);
    document.title='SW='+sw;
  },2200);
});
</script></body></html>
