/* =================================================================
   CLIENT PORTAL LOGIN — split screen, in the site's glass language.
   Left: a frosted panel carrying the brand, the official partner marks
   and the sign-in card. Right: the STARTRADER Cup car, full height,
   with the language switch and two floating helpers riding on it.
   ================================================================= */
.lg-wrap{position:relative;min-height:100svh;min-height:100vh;display:grid;grid-template-columns:minmax(0,48%) minmax(0,52%);
  background:
    radial-gradient(60% 70% at 10% 0%,rgba(42,114,255,.08),transparent 60%),
    radial-gradient(50% 60% at 40% 100%,rgba(122,164,255,.08),transparent 62%),
    linear-gradient(180deg,#f4f7fc 0%,#e8eef9 100%);overflow:clip}
/* ---- the frosted form panel ---- */
.lg-panel{position:relative;display:flex;flex-direction:column;
  background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(26px) saturate(1.45);backdrop-filter:blur(26px) saturate(1.45);
  border-right:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,24px 0 60px -40px rgba(30,70,150,.25)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.lg-panel{background:rgba(255,255,255,.94)}}
.lg-panel::before,.lg-panel::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.lg-panel::before{width:46vmin;height:46vmin;left:-14%;top:8%;background:radial-gradient(closest-side,rgba(42,114,255,.10),transparent 72%)}
.lg-panel::after{width:52vmin;height:52vmin;right:-10%;bottom:-8%;background:radial-gradient(closest-side,rgba(125,164,247,.12),transparent 72%)}
.lg-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:clamp(22px,3vw,36px) clamp(22px,4vw,48px) 0}
.lg-brand img{display:block;width:clamp(150px,13vw,190px);height:auto}
.lg-partners{display:flex;align-items:center;gap:clamp(18px,3vw,40px)}
.lg-partners img{display:block;height:clamp(34px,3.2vw,46px);width:auto}
.lg-partners .lg-porsche{height:clamp(36px,3.4vw,50px)}
.lg-body{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:clamp(28px,4vw,56px) clamp(22px,4vw,48px) clamp(32px,4vw,56px)}
/* ---- the card ---- */
.lg-card{width:min(460px,100%);animation:lgIn .6s cubic-bezier(.22,.61,.36,1) both}
@keyframes lgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lg-card>*{animation:lgIn .55s cubic-bezier(.22,.61,.36,1) both}
.lg-card>*:nth-child(2){animation-delay:.05s}.lg-card>*:nth-child(3){animation-delay:.1s}.lg-card>*:nth-child(4){animation-delay:.14s}
.lg-card>*:nth-child(5){animation-delay:.18s}.lg-card>*:nth-child(6){animation-delay:.22s}.lg-card>*:nth-child(7){animation-delay:.26s}
.lg-card>*:nth-child(8){animation-delay:.3s}.lg-card>*:nth-child(9){animation-delay:.34s}.lg-card>*:nth-child(10){animation-delay:.38s}
@media (prefers-reduced-motion:reduce){.lg-card,.lg-card>*{animation:none}}
.lg-card h1{text-align:center;font-size:clamp(24px,2.4vw,30px);letter-spacing:-.03em;color:#0c1526;margin-bottom:26px}
/* ---- the email / phone switch ---- */
.lg-tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:6px;border-radius:18px;
  background:rgba(12,21,38,.05);border:1px solid rgba(255,255,255,.8);margin-bottom:16px}
.lg-tabs::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc(50% - 6px);
  border-radius:13px;background:#fff;box-shadow:0 4px 14px -4px rgba(15,32,68,.18),0 0 0 1px #e9eef7;
  transition:transform .35s cubic-bezier(.22,.61,.36,1)}
.lg-tabs.is-phone::before{transform:translateX(100%)}
.lg-tab{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 6px;border:0;background:none;border-radius:13px;cursor:pointer;
  font:600 15px/1 inherit;font-family:inherit;color:#8a94a8;transition:color .25s}
.lg-tab svg{width:17px;height:17px;opacity:.75}
.lg-tab.is-on{color:#0c1526;font-weight:700}
.lg-tab.is-on svg{color:#2a72ff;opacity:1}
/* ---- fields ---- */
.lg-field{position:relative;margin-bottom:14px}
.lg-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;
  display:grid;place-items:center;border-radius:12px;background:rgba(42,114,255,.07);color:#2a72ff;transition:background .25s,color .25s}
.lg-ic svg{width:18px;height:18px}
.lg-field input{width:100%;height:60px;padding:22px 18px 6px 60px;border-radius:16px;border:1px solid rgba(20,44,96,.12);
  background:rgba(255,255,255,.78);color:#0c1526;font:600 15.5px/1.3 inherit;font-family:inherit;outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s}
.lg-field label{position:absolute;left:60px;top:50%;transform:translateY(-50%);pointer-events:none;color:#6b7686;font-size:15px;font-weight:500;
  transition:top .22s var(--ease),font-size .22s var(--ease),color .22s,transform .22s var(--ease)}
.lg-field label .req{font-style:normal;color:#2a72ff;margin-left:1px}
.lg-field input:focus ~ label,.lg-field input:not(:placeholder-shown) ~ label{top:9px;transform:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#2a72ff}
.lg-field input:not(:focus):not(:placeholder-shown) ~ label{color:#8a94a8}
.lg-field input:hover{border-color:#c9d6ea}
.lg-field input:focus{border-color:#2a72ff;background:#fff;box-shadow:0 0 0 4px rgba(42,114,255,.1)}
.lg-field input:focus ~ .lg-ic{background:rgba(42,114,255,.12)}
.lg-field--pw input{padding-right:52px}
.lg-eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);z-index:1;width:38px;height:38px;display:grid;place-items:center;
  border:0;background:none;border-radius:50%;cursor:pointer;color:#9aa4b6;transition:color .25s,background .25s}
.lg-eye:hover{color:#2a72ff;background:rgba(42,114,255,.07)}
.lg-eye svg{width:19px;height:19px}
.lg-eye .off{display:none}.lg-eye.show .on{display:none}.lg-eye.show .off{display:block}
.lg-forgot{display:inline-block;margin:2px 2px 24px;font-size:14px;font-weight:600;color:#2a72ff}
.lg-forgot:hover{text-decoration:underline;text-underline-offset:3px}
/* ---- actions ---- */
.lg-submit{position:relative;overflow:hidden;width:100%;justify-content:center;gap:9px;height:58px;border-radius:14px;font-size:16px;letter-spacing:.01em;
  transition:transform .25s var(--ease),box-shadow .3s}
.lg-submit::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);transition:left .6s var(--ease)}
.lg-submit:hover::after{left:120%}
.lg-submit:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){.lg-submit::after{display:none}}
.lg-div{display:flex;align-items:center;gap:14px;margin:28px 0 18px;color:#5a6478;font-size:14px}
.lg-div::before,.lg-div::after{content:"";flex:1;height:0;border-top:1px solid #dbe3f0}
.lg-social{display:flex;justify-content:center;gap:14px}
.lg-social a{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);border:1px solid rgba(20,44,96,.1);
  box-shadow:0 8px 20px -14px rgba(15,32,68,.35);transition:transform .3s var(--ease),box-shadow .3s,border-color .25s}
.lg-social a:hover{transform:translateY(-3px);border-color:#c9d6ea;box-shadow:0 14px 28px -16px rgba(15,32,68,.35)}
.lg-social svg{width:20px;height:20px;color:#2AABEE}
.lg-foot{margin:28px 0 12px;text-align:center;font-size:14px;color:#33415e}
.lg-open{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;
  background:linear-gradient(120deg,#0a2f8a 0%,#0047bb 55%,#1a5fe0 100%);box-shadow:0 18px 36px -20px rgba(0,71,187,.6);
  transition:transform .3s var(--ease),box-shadow .3s}
.lg-open:hover{transform:translateY(-2px);box-shadow:0 26px 48px -22px rgba(0,71,187,.65);color:#fff}
/* ---- the picture panel ---- */
.lg-art{position:relative;overflow:hidden;background:#061033}
.lg-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.lg-art::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(6,16,51,.28) 0%,rgba(6,16,51,0) 22%),linear-gradient(180deg,rgba(6,16,51,.22) 0%,rgba(6,16,51,0) 24%)}
/* language switch rides top-right on the picture */
.lg-lang{position:absolute;top:clamp(18px,3vw,30px);right:clamp(18px,3vw,36px);z-index:3}
.lg-lang-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:40px;cursor:pointer;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;font:600 14px/1 inherit;font-family:inherit;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .25s,border-color .25s}
.lg-lang-btn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.lg-lang-btn svg{width:16px;height:16px;color:#fff}
.lg-lang-pop{position:absolute;top:calc(100% + 8px);right:0;width:210px;max-height:300px;overflow:auto;padding:6px;border-radius:16px;
  background:#fff;border:1px solid #e9eef7;box-shadow:0 24px 54px -24px rgba(15,32,68,.45)}
.lg-lang-pop button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;
  font:600 13.5px/1.2 inherit;font-family:inherit;color:#33415e;transition:background .2s,color .2s}
.lg-lang-pop button:hover{background:#f2f5fa;color:#0c1526}
.lg-lang-pop button.is-on{color:#2a72ff;background:rgba(42,114,255,.07)}
/* two floating helpers, bottom-right */
.lg-fabs{position:absolute;right:clamp(18px,3vw,36px);bottom:clamp(18px,3vw,36px);z-index:3;display:flex;flex-direction:column;gap:12px}
.lg-fab{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:#fff;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:background .25s,transform .3s var(--ease)}
.lg-fab:hover{background:rgba(255,255,255,.2);transform:translateY(-2px);color:#fff}
.lg-fab svg{width:20px;height:20px}
/* ---- narrow screens: the picture becomes a short banner above the form ---- */
@media (max-width:980px){
  .lg-wrap{grid-template-columns:1fr}
  .lg-art{display:none}
  .lg-panel{border-right:0;box-shadow:none}
  .lg-top{flex-direction:column;align-items:stretch;gap:0;padding-right:150px}
  .lg-brand{display:flex;align-items:center;height:40px}
  .lg-brand img{width:150px}
  .lg-partners{width:calc(100% + 150px);margin-top:16px;padding-top:16px;border-top:1px solid rgba(20,44,96,.08);justify-content:center;gap:28px}
  .lg-partners img,.lg-partners .lg-porsche{height:34px}
  .lg-lang{top:22px;right:22px}
  .lg-body{padding-top:28px}
  .lg-lang-btn{background:#f2f5fa;border-color:#e9eef7;color:#33415e;-webkit-backdrop-filter:none;backdrop-filter:none}
  .lg-lang-btn:hover{background:#fff;border-color:#d5deed}
  .lg-lang-btn svg{color:#8a94a8}
}
@media (max-width:640px){
  .lg-partners{gap:22px}
  .lg-partners img,.lg-partners .lg-porsche{height:30px}
  .lg-tab{padding:12px 4px;font-size:13.5px}
}
@media (max-width:400px){
  .lg-tab svg{display:none}
}
  </style>

<script>
/* method switch + password reveal — page-scoped */
(function () {
  var tabs = document.getElementById('lgTabs');
  var tEmail = document.getElementById('lgTabEmail');
  var tPhone = document.getElementById('lgTabPhone');
  var id = document.getElementById('lgId');
  function setMode(phone) {
    tabs.classList.toggle('is-phone', phone);
    tEmail.classList.toggle('is-on', !phone);
    tPhone.classList.toggle('is-on', phone);
    tEmail.setAttribute('aria-selected', String(!phone));
    tPhone.setAttribute('aria-selected', String(phone));
    id.type = phone ? 'tel' : 'email';
    document.getElementById('lgIdLabel').textContent = phone ? 'Phone Number' : 'Email';
    id.value = '';
    id.focus();
  }
  tEmail.addEventListener('click', function () { setMode(false); });
  tPhone.addEventListener('click', function () { setMode(true); });

  var eye = document.getElementById('lgEye');
  var pw = document.getElementById('lgPw');
  eye.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.classList.toggle('show', show);
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  document.querySelector('.lg-card').addEventListener('submit', function (e) { e.preventDefault(); });
})();



/* language chip */
(function () {
  var wrap = document.getElementById('lgLang');
  if (!wrap) return;
  var btn = wrap.querySelector('.lg-lang-btn');
  var pop = wrap.querySelector('.lg-lang-pop');
  var code = document.getElementById('lgLangCode');
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = pop.hidden;
    pop.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', function (e) {
    if (!pop.hidden && !wrap.contains(e.target)) { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  });
  pop.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      pop.querySelectorAll('button').forEach(function (x) { x.classList.remove('is-on'); x.setAttribute('aria-selected', 'false'); });
      b.classList.add('is-on');
      b.setAttribute('aria-selected', 'true');
      code.textContent = b.textContent;
      pop.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
</body>
</html>
